name: Promote Castlabs VSI prerelease to PyPI

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable Castlabs prerelease tag
        required: true
        default: castlabs-v0.37.8.dev1
        type: string

concurrency:
  group: castlabs-vsi-pypi-0.37.8.dev1
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    environment: pypipublish
    permissions:
      attestations: read
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: castlabs/c2pa-python
          ref: castlabs-v0.37.8.dev1
          fetch-depth: 0
          path: c2pa-python

      - name: Run lightweight release tooling tests
        shell: bash
        run: |
          python3 -m pip install pytest==8.4.1 jsonschema==4.25.1
          python3 -m pytest -q c2pa-python/tests/test_castlabs_release_tooling.py

      - name: Download and verify immutable release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          INPUT_RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          test "${INPUT_RELEASE_TAG}" = castlabs-v0.37.8.dev1
          test "$(python3 c2pa-python/scripts/castlabs_release.py lock-value package.version)" = 0.37.8.dev1
          test "$(gh api repos/castlabs/c2pa-python/releases/tags/castlabs-v0.37.8.dev1 --jq '(.draft == false and .prerelease == true)')" = true
          SOURCE_SHA=$(git -C c2pa-python rev-parse HEAD)
          test "$(git -C c2pa-python rev-list -n 1 castlabs-v0.37.8.dev1)" = "$SOURCE_SHA"
          mkdir -p download dist
          gh release download castlabs-v0.37.8.dev1 \
            --repo castlabs/c2pa-python --dir download
          python3 c2pa-python/scripts/castlabs_release.py validate-release-assets \
            --assets-dir download
          pushd download
          sha256sum --check *.sha256
          popd
          for ARTIFACT in download/*; do
            gh attestation verify "$ARTIFACT" \
              --repo castlabs/c2pa-python \
              --signer-workflow castlabs/c2pa-python/.github/workflows/castlabs-vsi-release.yml \
              --signer-digest "$SOURCE_SHA" \
              --source-ref refs/tags/castlabs-v0.37.8.dev1 \
              --source-digest "$SOURCE_SHA" \
              --deny-self-hosted-runners
          done
          python3 c2pa-python/scripts/castlabs_release.py validate-evidence \
            --evidence download/c2pa-python-0.37.8.dev1-native-linux-x86_64.tar.gz.evidence.json \
            --artifact-dir download --source-sha "$SOURCE_SHA"
          python3 c2pa-python/scripts/castlabs_release.py validate-evidence \
            --evidence download/c2pa-python-0.37.8.dev1-native-windows-x86_64.tar.gz.evidence.json \
            --artifact-dir download --source-sha "$SOURCE_SHA"
          python3 c2pa-python/scripts/castlabs_release.py validate-evidence \
            --evidence download/c2pa-python-0.37.8.dev1-py3-none-wheels.tar.gz.evidence.json \
            --artifact-dir download --source-sha "$SOURCE_SHA"
          python3 c2pa-python/scripts/castlabs_release.py extract \
            --archive download/c2pa-python-0.37.8.dev1-py3-none-wheels.tar.gz \
            --destination dist
          test "$(find dist -maxdepth 1 -name '*.whl' | wc -l)" -eq 2
          cmp dist/c2pa_python-0.37.8.dev1-py3-none-manylinux_2_28_x86_64.whl \
            download/c2pa_python-0.37.8.dev1-py3-none-manylinux_2_28_x86_64.whl
          cmp dist/c2pa_python-0.37.8.dev1-py3-none-win_amd64.whl \
            download/c2pa_python-0.37.8.dev1-py3-none-win_amd64.whl
          python3 -m pip install packaging==25.0 twine==6.2.0
          python3 -c 'from packaging.version import Version; v=Version("0.37.8.dev1"); assert v.is_prerelease and str(v)=="0.37.8.dev1"'
          python3 -m twine check dist/*.whl

      - name: Preflight retry-safe PyPI upload set
        id: pypi
        shell: bash
        run: |
          STATUS=$(curl --silent --show-error --location \
            --output pypi-response.json --write-out '%{http_code}' \
            https://pypi.org/pypi/c2pa-python/0.37.8.dev1/json)
          case "$STATUS" in
            200|404) ;;
            *) echo "unexpected PyPI JSON API status: $STATUS" >&2; exit 1 ;;
          esac
          python3 c2pa-python/scripts/castlabs_release.py pypi-plan \
            --wheels-dir dist --response pypi-response.json \
            --http-status "$STATUS" --destination publish-dist \
            --output pypi-plan.json --github-output "$GITHUB_OUTPUT"

      - name: Publish approved prerelease to PyPI
        if: steps.pypi.outputs.upload == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        with:
          packages-dir: publish-dist/
