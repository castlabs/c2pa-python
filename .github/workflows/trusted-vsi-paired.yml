name: Trusted VSI functional source and wheel qualification (non-publishing)

on:
  workflow_call:
    inputs:
      python-ref:
        description: Python source under test (defaults to the caller commit)
        type: string
        default: ""

permissions:
  contents: read

jobs:
  paired-api:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            library: libc2pa_c.so
          - os: windows-2022
            library: c2pa_c.dll
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    env:
      CARGO_BUILD_JOBS: "1"
      CARGO_INCREMENTAL: "0"
      CARGO_TARGET_DIR: ${{ github.workspace }}/paired-rust/target
      PYTHONPATH: ${{ github.workspace }}/python-source/src
      C2PA_LIBRARY_NAME: ${{ github.workspace }}/paired-rust/target/debug/${{ matrix.library }}
      C2PA_SOURCE_BUILD_VERSION: 0.91.0-dev
      C2PA_TRUSTED_VSI_ABI_REQUIRED: "1"
      C2PA_TRUSTED_VSI_FUNCTIONAL_REQUIRED: "1"
      FUNCTIONAL_BUILD_VERSION: 0.37.9.dev0
    steps:
      - name: Require a full Python source SHA
        shell: bash
        env:
          PYTHON_SOURCE_SHA: ${{ inputs.python-ref || github.sha }}
        run: '[[ "$PYTHON_SOURCE_SHA" =~ ^[0-9a-f]{40}$ ]]'
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ inputs.python-ref || github.sha }}
          path: python-source
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          repository: castlabs/c2pa-rs
          # Reviewed functional trusted VSI native (feat/trusted-vsi-functional).
          # Qualification-only pairing; never the immutable dev5 release input.
          ref: 1d605b5a2033d5812742e302db3e5f9af347f68d
          path: paired-rust
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
      - name: Record paired source identities
        shell: bash
        run: |
          git -C python-source rev-parse HEAD
          git -C paired-rust rev-parse HEAD
      - name: Build isolated functional native library
        shell: bash
        working-directory: paired-rust
        run: |
          rustup toolchain install 1.88.0 --profile minimal
          cargo +1.88.0 build --locked -p c2pa-c-ffi --no-default-features \
            --features rust_native_crypto,http,add_thumbnails,file_io,unstable_live_video
      - name: Prepare source dependencies
        shell: bash
        working-directory: python-source
        run: |
          python -m pip install -r requirements.txt pytest==8.4.1 setuptools==68.0.0 toml==0.10.2 wheel==0.46.2 packaging==26.0 cbor2==5.9.0
          python setup.py egg_info
      - name: Require functional native ABI and run focused tests without skips
        shell: bash
        working-directory: python-source
        run: python -m pytest -q tests/test_trusted_vsi_api.py -ra
      - name: Non-threaded regressions
        timeout-minutes: 20
        shell: bash
        working-directory: python-source
        run: python -m pytest -q --ignore=tests/test_unit_tests_threaded.py -o faulthandler_timeout=120
      - name: Threaded regressions
        timeout-minutes: 15
        shell: bash
        working-directory: python-source
        run: python -m pytest -q tests/test_unit_tests_threaded.py -o faulthandler_timeout=120
      - name: Build separate development wheel and sdist (no publication)
        shell: bash
        working-directory: python-source
        run: python scripts/build_trusted_vsi_functional.py --library "$C2PA_LIBRARY_NAME" --out build/functional-qualification
      - name: Qualify installed functional wheel without source or library overrides
        shell: bash
        working-directory: python-source
        run: |
          python scripts/qualify_trusted_vsi_functional.py \
            --wheel build/functional-qualification/*.whl \
            --venv build/functional-installed --version "$FUNCTIONAL_BUILD_VERSION"
      # No upload, immutable release evidence changes, credentials, or publication.
